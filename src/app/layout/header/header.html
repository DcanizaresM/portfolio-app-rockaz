<header class="bg-slate-950/80 backdrop-blur-md border-b border-white/10 sticky top-0 z-50">
  <div class="container mx-auto px-4 sm:px-6 lg:px-8 max-w-7xl h-16 flex items-center justify-between">
    
    <a href="#inicio" class="flex items-center gap-2 cursor-pointer">
      <span class="text-2xl font-black tracking-tighter text-white">
        @if (portfolioFacade.portfolioData(); as data) {
          {{ data.name }}<span class="text-indigo-400">.</span>
        } @else {
          Portfolio<span class="text-indigo-400">.</span>
        }
      </span>
    </a>

    <nav class="hidden md:flex items-center gap-8">
      <a href="#proyectos" class="text-sm font-semibold text-slate-300 hover:text-indigo-400 transition-colors cursor-pointer">Proyectos</a>
      <a href="#sobre-mi" class="text-sm font-semibold text-slate-300 hover:text-indigo-400 transition-colors cursor-pointer">Sobre mí</a>
      <a href="#contacto" class="text-sm font-semibold text-slate-300 hover:text-indigo-400 transition-colors cursor-pointer">Contacto</a>
      
      <span class="border-l border-white/10 h-5" aria-hidden="true"></span>

      <div class="flex items-center gap-3">
          
          <a href="https://www.linkedin.com/in/dcanizaresm" 
             target="_blank" 
             rel="noopener noreferrer" 
             aria-label="Visitar perfil de LinkedIn"
             class="text-slate-400 hover:text-indigo-400 transition-colors flex items-center justify-center p-2 hover:scale-110 transform duration-200">
             
             <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
               <path fill-rule="evenodd" d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.3-3.9-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z" clip-rule="evenodd" />
             </svg>
          </a>

          <a href="https://github.com/DcanizaresM" 
             target="_blank" 
             rel="noopener noreferrer" 
             aria-label="Ver código en GitHub"
             class="text-slate-400 hover:text-white transition-colors flex items-center justify-center p-2 hover:scale-110 transform duration-200">
             
             <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd" />
             </svg>
          </a>
      </div>
    </nav>

    <button (click)="toggleMenu()" class="md:hidden p-2 text-slate-300 hover:text-indigo-400 focus:outline-none">
      @if (!isMenuOpen()) {
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12h18M3 6h18M3 18h18" /></svg>
      } @else {
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
      }
    </button>
  </div>

  @if (isMenuOpen()) {
    <div class="md:hidden bg-slate-900 border-b border-white/10 absolute w-full shadow-2xl">
      <nav class="flex flex-col px-4 pt-2 pb-6 space-y-3">
        <a href="#proyectos" (click)="toggleMenu()" class="block px-3 py-2 text-base font-semibold text-slate-300 hover:text-white hover:bg-slate-800 rounded-md">Proyectos</a>
        <a href="#sobre-mi" (click)="toggleMenu()" class="block px-3 py-2 text-base font-semibold text-slate-300 hover:text-white hover:bg-slate-800 rounded-md">Sobre mí</a>
        <a href="#contacto" (click)="toggleMenu()" class="block px-3 py-2 text-base font-semibold text-slate-300 hover:text-white hover:bg-slate-800 rounded-md">Contacto</a>
        
        <hr class="border-white/10 my-2">
        
        <div class="flex items-center gap-4 px-3 py-2">
            <a href="https://www.linkedin.com/in/dcanizaresm" 
              target="_blank" 
              rel="noopener noreferrer"
              (click)="toggleMenu()" 
              aria-label="Conectar en LinkedIn"
              class="text-slate-400 hover:text-indigo-400 transition-colors p-2">
              <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path fill-rule="evenodd" d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.3-3.9-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z" clip-rule="evenodd" />
              </svg>
            </a>

            <a href="https://github.com/DcanizaresM" 
              target="_blank" 
              rel="noopener noreferrer"
              (click)="toggleMenu()" 
              aria-label="Ver código en GitHub"
              class="text-slate-400 hover:text-white transition-colors p-2">
              <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                  <path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd" />
              </svg>
            </a>
        </div>
      </nav>
    </div>
  }
</header>
