<a [href]="project().githubUrl" target="_blank" rel="noopener noreferrer" class="bg-slate-900 rounded-2xl shadow-lg hover:shadow-indigo-500/20 transition-all duration-300 border border-white/5 overflow-hidden group flex flex-col h-full hover:-translate-y-1 cursor-pointer block">  
  <img [src]="project().imageUrl" [alt]="project().title" class="w-full h-56 object-cover group-hover:scale-105 transition-transform duration-500 bg-slate-800 opacity-90 group-hover:opacity-100">
  
  <div class="p-6 flex-grow flex flex-col">
    <div class="flex justify-between items-start gap-4">
      <h3 class="text-xl font-bold text-white group-hover:text-indigo-400 transition-colors">{{ project().title }}</h3>
      
      <svg class="w-5 h-5 text-slate-600 group-hover:text-indigo-400 transition-colors shrink-0 mt-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
      </svg>
    </div>

    <p class="mt-3 text-slate-400 line-clamp-3 flex-grow">{{ project().description }}</p>
    
    <div class="mt-6 flex flex-wrap gap-2">
      @for (tech of project().technologies; track tech) {
        <span class="px-3 py-1 bg-indigo-500/10 border border-indigo-500/20 text-indigo-300 text-xs font-bold rounded-full tracking-wide">
          {{ tech }}
        </span>
      }
    </div>
  </div>
</a>
